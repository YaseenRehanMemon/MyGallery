version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: minio-gallery
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web UI (Console)
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123 # CHANGE THIS
      MINIO_BROWSER_REDIRECT_URL: "http://80.225.203.16:9001"
    command: server /data --console-address ":9001"
    restart: always

volumes:
  minio_data:
